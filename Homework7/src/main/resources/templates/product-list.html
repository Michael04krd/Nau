<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Список товаров</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        button {
            padding: 8px 16px;
            cursor: pointer;
        }
        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }
        .report-link {
            margin-left: 15px;
            color: #2196F3;
        }
    </style>
</head>
<body>

<div class="toolbar">
    <form th:action="@{/logout}" method="post">
        <button type="submit">Выйти</button>
    </form>

    <button type="button" id="createReportBtn">Сформировать отчет по складу</button>

    <div id="reportResult" style="display: inline-block;"></div>
</div>

<h1>Список товаров</h1>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Название</th>
        <th>Категория</th>
        <th>Цена</th>
        <th>Количество</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="product : ${products}">
        <td th:text="${product.id}">1</td>
        <td th:text="${product.name}">Название</td>
        <td th:text="${product.category.name}">Категория</td>
        <td th:text="${product.price}">0</td>
        <td th:text="${product.quantity}">0</td>
    </tr>
    </tbody>
</table>

<script>
    // Получаем CSRF токен из cookie или из мета-тега
    function getCsrfToken() {
        const csrfToken = document.querySelector('input[name="_csrf"]')?.value;
        if (csrfToken) return csrfToken;

        const cookieValue = document.cookie
            .split('; ')
            .find(row => row.startsWith('XSRF-TOKEN='))
            ?.split('=')[1];
        return cookieValue || '';
    }

    document.getElementById('createReportBtn').addEventListener('click', function() {
        fetch('/reports', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRF-TOKEN': getCsrfToken()
            }
        })
        .then(response => response.json())
        .then(data => {
            const reportId = data.reportId;
            const resultDiv = document.getElementById('reportResult');
            resultDiv.innerHTML = `<a href="/reports/${reportId}" target="_blank" class="report-link">Отчет #${reportId}</a>`;
        })
        .catch(error => {
            console.error('Ошибка:', error);
            document.getElementById('reportResult').innerHTML = '<span style="color: red;">Ошибка при создании отчета</span>';
        });
    });
</script>

</body>
</html>
